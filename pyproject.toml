[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-landrop"
version = "0.1.0"
description = "Small, token-protected LAN/Tailnet file drop"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "LumenLanDrop contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
lumen-landrop = "lumen_landrop.cli:main"

[tool.setuptools.packages.find]
include = ["lumen_landrop*"]
